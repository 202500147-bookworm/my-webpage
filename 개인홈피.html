<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>허다경 | 개인 홈페이지</title>
<style>
  :root {
    --bg: #f6f1e7;
    --card: #fffdf8;
    --ink: #2f2a24;
    --muted: #7a6f62;
    --accent: #8a4b3c;
    --line: #e4dccb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 20px 64px; }

  header { text-align: center; padding: 24px 0 36px; }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: "Noto Serif KR", "Batang", serif;
    font-size: 40px; margin: 0 auto 18px;
  }
  h1 {
    font-family: "Noto Serif KR", "Batang", serif;
    font-size: 2.2rem; letter-spacing: 0.08em;
  }
  .intro { color: var(--muted); margin-top: 6px; font-size: 1.05rem; }

  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px 26px;
    margin-bottom: 18px;
  }
  h2 {
    font-family: "Noto Serif KR", "Batang", serif;
    font-size: 1.1rem; color: var(--accent);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  dl { display: grid; grid-template-columns: 90px 1fr; gap: 8px 12px; }
  dt { color: var(--muted); }
  a { color: var(--accent); }
  .tag {
    display: inline-block; background: #efe4d3; color: var(--accent);
    padding: 3px 12px; border-radius: 999px; font-size: 0.95rem;
  }
  .placeholder { color: var(--muted); }

  .project {
    display: block; text-decoration: none; color: inherit;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; transition: border-color .15s, transform .15s;
  }
  .project:hover { border-color: var(--accent); transform: translateY(-2px); }
  .project strong { display: block; color: var(--accent); }
  .project span { font-size: 0.92rem; color: var(--muted); }

  footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 28px; }
  @media (max-width: 480px) {
    dl { grid-template-columns: 1fr; gap: 2px; }
    dd { margin-bottom: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="avatar">허</div>

  </header>

  <section id="about">

    <dl>
      <dt>이름</dt><dd>허다경</dd>
      <dt>소속</dt><dd>공주대학교 25학번</dd>
      <dt>이메일</dt><dd><a href="mailto:202500147@smail.kongju.ac.kr">202500147@smail.kongju.ac.kr</a></dd>
    </dl>
  </section>

  <section id="interests">
    <h2>관심사</h2>
    <span class="tag">고전문학</span>
  </section>

  <section id="activities">
    <h2>주요 활동</h2>
    <!-- 활동 내용을 아래 목록에 추가하세요. 예: <li>활동명 (기간) - 간단한 설명</li> -->
    <p class="placeholder">활동 내용을 곧 추가할 예정입니다.</p>
    <ul id="activity-list"></ul>
  </section>

  <section id="projects">
    <h2>개별 프로젝트</h2>
    <a class="project" href="file:///C:/Users/USER/Downloads/%EC%98%A4%EB%8A%98%EC%9D%98%ED%95%A0%EC%9D%BC.html" target="_blank" rel="noopener">
      <strong>오늘의 할 일 관리</strong>
      <span>대학생을 위한 할 일 관리 앱 바로가기 →</span>
    </a>
  </section>

  <footer>© 2026 허다경</footer>
</div>
</body>
</html>
