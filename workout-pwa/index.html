<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#286b48">
<meta name="description" content="운동, 독서, 습관을 매일 기록하고 월간 달성도를 확인하는 개인 기록 앱">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="핏데이">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>핏데이 | 데일리 기록</title>
<style>
:root{--green:#286b48;--green2:#e9f4ec;--ink:#1e2b23;--muted:#748078;--line:#e5ebe6;--bg:#f4f7f4;--white:#fff;--orange:#e7a45c;--shadow:0 10px 30px #203c2910}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit}button{cursor:pointer}.app{max-width:1040px;margin:auto;padding:22px 20px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:19px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--green);color:white;font-size:22px}.header-actions{display:flex;align-items:center;gap:8px}.today-label{font-size:13px;color:var(--muted);font-weight:650}.install,.secondary,.primary,.tab,.month-btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700}.install,.primary{background:var(--green);color:white}.install[hidden]{display:none}.secondary,.month-btn{background:#edf2ed;color:#45534a}.hero{margin:12px 0 20px}.eyebrow{font-size:11px;letter-spacing:1.4px;font-weight:850;color:var(--green)}h1{font-size:clamp(26px,4vw,38px);letter-spacing:-1.2px;margin:6px 0}.hero p{margin:0;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;padding:5px;background:#eaf0ea;border-radius:14px;width:max-content;max-width:100%;margin:20px 0 16px}.tab{background:transparent;color:#667269;padding:10px 18px}.tab.active{background:white;color:var(--green);box-shadow:0 2px 8px #1f3d2810}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(270px,.75fr);gap:16px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panel h2{font-size:17px;margin:0}.muted{color:var(--muted);font-size:12px}
.date-line{display:flex;align-items:center;gap:8px;margin-bottom:16px}.date-line input{border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--ink);background:white}
.add-form{display:grid;grid-template-columns:minmax(0,1fr) 100px 84px;gap:8px;margin-bottom:14px}.add-form input{width:100%;min-width:0;border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none}.add-form input:focus,.entry-value:focus{border-color:var(--green)}.primary{padding:10px 12px}
.items{display:flex;flex-direction:column;gap:9px}.entry{display:grid;grid-template-columns:24px minmax(0,1fr) 94px 30px;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;padding:11px 10px}.entry.checked{background:#f7fbf7}.tick{width:20px;height:20px;accent-color:var(--green)}.entry-title{font-size:14px;font-weight:700;overflow-wrap:anywhere}.entry-sub{font-size:11px;color:var(--muted);margin-top:3px}.entry.checked .entry-title{text-decoration:line-through;color:#89948c}.value-wrap{display:flex;align-items:center;gap:5px}.entry-value{width:62px;min-width:0;padding:7px 5px;border:1px solid var(--line);border-radius:8px;text-align:right}.unit{font-size:11px;color:var(--muted)}.del{border:0;background:transparent;color:#a2ada4;font-size:19px}.empty{padding:25px 8px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.month-title{font-weight:800}.month-btn{padding:7px 10px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow,.day{display:grid;place-items:center;min-height:35px;font-size:12px}.dow{color:var(--muted);font-weight:750}.day{border:0;border-radius:10px;background:#f6f8f6;color:var(--ink);position:relative}.day.muted-day{color:#c0c8c1;background:transparent}.day.selected{outline:2px solid var(--green);background:var(--green2);font-weight:850}.day.today:not(.selected){background:#eaf2eb;font-weight:800}.day.has-data:after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--green)}.day.selected:after{background:var(--orange)}
.stats{margin-top:16px}.stats-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.stat-number{font-size:25px;font-weight:850}.stat-number small{font-size:12px;color:var(--muted);font-weight:600}.bars{height:125px;display:flex;align-items:end;gap:5px;border-bottom:1px solid var(--line);padding:8px 2px 0}.bar-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px}.bar{width:min(100%,22px);min-height:3px;background:#8fbea0;border-radius:5px 5px 0 0}.bar.current{background:var(--green)}.bar-label{font-size:10px;color:var(--muted)}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}
.note{margin-top:16px;padding:12px 14px;border-radius:12px;background:#f1f6f1;color:#5d6b60;font-size:12px;line-height:1.6}.foot{display:flex;justify-content:space-between;gap:12px;margin-top:18px;color:var(--muted);font-size:11px}
@media(max-width:760px){.app{padding:16px 13px 34px}.grid{grid-template-columns:1fr}.panel{padding:16px}.calendar-panel{order:2}.today-panel{order:1}.header-actions{flex-direction:column;align-items:flex-end;gap:5px}.today-label{font-size:11px}.brand{font-size:17px}.logo{width:38px;height:38px}.tabs{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.tab{padding:10px 8px}.add-form{grid-template-columns:minmax(0,1fr) 78px 70px;gap:6px}.entry{grid-template-columns:22px minmax(0,1fr) 88px 24px;gap:7px;padding:10px 8px}.entry-value{width:56px}.day{min-height:39px}}
@media(max-width:360px){.add-form{grid-template-columns:1fr 68px}.add-form input[name=unit]{grid-column:1}.add-form .primary{grid-column:2;grid-row:1/3}.entry{grid-template-columns:20px minmax(0,1fr) 78px 20px}.entry-value{width:48px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">✓</div>핏데이 <span style="font-weight:500;color:#849087">데일리 기록</span></div>
  <div class="header-actions"><span class="today-label" id="todayLabel"></span><button class="install" id="installBtn" hidden>홈 화면에 설치</button></div>
</header>
<section class="hero"><div class="eyebrow">MY DAILY JOURNAL</div><h1>매일의 작은 실천이<br>나만의 기록이 돼요.</h1><p>운동 · 독서 · 습관을 기록하고 달력과 월간 통계로 확인하세요.</p></section>
<nav class="tabs" aria-label="기록 종류">
  <button class="tab active" data-type="workout">🏃 운동</button><button class="tab" data-type="reading">📚 독서</button><button class="tab" data-type="habit">🌱 습관</button>
</nav>
<div class="grid">
<section class="panel today-panel">
  <div class="panel-head"><h2 id="listTitle">오늘의 운동</h2><span class="muted" id="dailyProgress">0 / 0 완료</span></div>
  <div class="date-line"><label class="muted" for="selectedDate">기록 날짜</label><input id="selectedDate" type="date"></div>
  <form class="add-form" id="addForm">
    <input name="name" maxlength="36" placeholder="항목 이름 (예: 걷기)" aria-label="항목 이름" required>
    <input name="unit" maxlength="8" placeholder="단위" aria-label="측정 단위 (예: km)">
    <button class="primary" type="submit">＋ 추가</button>
  </form>
  <div class="items" id="items"></div>
  <div class="note" id="typeHint">체크와 함께 거리(km), 횟수(개) 등 숫자를 입력할 수 있어요. 입력값은 날짜별로 자동 저장됩니다.</div>
</section>
<aside class="panel calendar-panel">
  <div class="calendar-head"><button class="month-btn" id="prevMonth" aria-label="이전 달">‹</button><div class="month-title" id="monthTitle"></div><button class="month-btn" id="nextMonth" aria-label="다음 달">›</button></div>
  <div class="calendar" id="calendar"></div>
  <div class="stats">
    <div class="stats-top"><h2>월간 달성 통계</h2><span class="muted" id="monthCount"></span></div>
    <div class="stat-number" id="monthPercent">0% <small>평균 달성률</small></div>
    <div class="bars" id="bars" aria-label="날짜별 달성률 그래프"></div>
    <div class="legend"><span><i class="dot"></i>일별 달성률</span><span id="monthDoneText">완료 0건</span></div>
  </div>
</aside>
</div>
<div class="foot"><span>🔒 기록은 이 브라우저의 기기에 저장됩니다.</span><span>핏데이 PWA</span></div>
</div>
<script>
const STORE='fitday-pwa-data-v3';
const TYPES={
 workout:{title:'오늘의 운동',hint:'거리(km), 횟수(개), 시간(분) 등 운동량을 입력하세요.',defaults:[['걷기','km'],['스쿼트','회'],['플랭크','분']]},
 reading:{title:'오늘의 독서',hint:'읽은 페이지 수, 독서 시간(분) 등을 기록하세요.',defaults:[['독서','쪽'],['독서 시간','분']]},
 habit:{title:'오늘의 습관',hint:'물 마시기, 스트레칭 등 반복하고 싶은 습관과 횟수를 기록하세요.',defaults:[['물 마시기','잔'],['스트레칭','분'],['일찍 잠자기','회']]}
};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const toKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
let data={items:{workout:[],reading:[],habit:[]},days:{}};
let hasExistingData=false;
try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved&&saved.items&&saved.days){data=saved;hasExistingData=true;}}catch(e){}
for(const type of Object.keys(TYPES)){if(!Array.isArray(data.items[type]))data.items[type]=[];}
let active='workout', selected=toKey(new Date()), shownMonth=new Date();
function persist(){try{localStorage.setItem(STORE,JSON.stringify(data));}catch(e){alert('저장 공간이 부족하거나 브라우저 저장이 차단되어 있어요.');}}
function dayRecord(key){if(!data.days[key])data.days[key]={};if(!data.days[key][active])data.days[key][active]={};return data.days[key][active];}
function getStatus(key,type,id){return data.days[key]?.[type]?.[id]||{done:false,value:''};}
function renderItems(){
 const cfg=TYPES[active],list=$('#items');$('#listTitle').textContent=cfg.title;$('#typeHint').textContent=cfg.hint;
 $('#selectedDate').value=selected;list.innerHTML='';
 const entries=data.items[active];let done=0;
 if(!entries.length){list.innerHTML='<div class="empty">아직 등록된 항목이 없어요.<br>위 입력창에서 나만의 항목을 추가해 보세요.</div>';}
 entries.forEach(item=>{
  const st=getStatus(selected,active,item.id);if(st.done)done++;
  const row=document.createElement('div');row.className='entry'+(st.done?' checked':'');
  const cb=document.createElement('input');cb.type='checkbox';cb.className='tick';cb.checked=!!st.done;cb.setAttribute('aria-label',item.name+' 완료');
  cb.addEventListener('change',()=>{const r=dayRecord(selected);r[item.id]={...getStatus(selected,active,item.id),done:cb.checked};persist();renderAll();});
  const title=document.createElement('div');const nm=document.createElement('div');nm.className='entry-title';nm.textContent=item.name;const sub=document.createElement('div');sub.className='entry-sub';sub.textContent=st.done?'완료':'진행 전';title.append(nm,sub);
  const wrap=document.createElement('div');wrap.className='value-wrap';const val=document.createElement('input');val.type='number';val.min='0';val.step='any';val.inputMode='decimal';val.className='entry-value';val.placeholder='0';val.value=st.value??'';val.setAttribute('aria-label',item.name+' 수치');
  val.addEventListener('change',()=>{const r=dayRecord(selected);r[item.id]={...getStatus(selected,active,item.id),value:val.value};persist();renderAll();});
  const unit=document.createElement('span');unit.className='unit';unit.textContent=item.unit||'';
  wrap.append(val,unit);
  const del=document.createElement('button');del.className='del';del.type='button';del.textContent='×';del.setAttribute('aria-label',item.name+' 항목 삭제');del.addEventListener('click',()=>{if(confirm(`"${item.name}" 항목을 삭제할까요?`)){data.items[active]=data.items[active].filter(x=>x.id!==item.id);Object.values(data.days).forEach(day=>{if(day[active])delete day[active][item.id];});persist();renderAll();}});
  row.append(cb,title,wrap,del);list.append(row);
 });
 $('#dailyProgress').textContent=`${done} / ${entries.length} 완료`;
}
function statsFor(key,type){const items=data.items[type];const record=data.days[key]?.[type]||{};const done=items.filter(i=>record[i.id]?.done).length;return {done,total:items.length,pct:items.length?Math.round(done/items.length*100):0};}
function renderCalendar(){
 const y=shownMonth.getFullYear(),m=shownMonth.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);
 $('#monthTitle').textContent=`${y}년 ${m+1}월`;const cal=$('#calendar');cal.innerHTML='';
 ['일','월','화','수','목','금','토'].forEach(x=>{const el=document.createElement('div');el.className='dow';el.textContent=x;cal.append(el);});
 const offset=first.getDay();for(let i=0;i<offset;i++){const el=document.createElement('div');el.className='day muted-day';cal.append(el);}
 const today=toKey(new Date());
 for(let d=1;d<=last.getDate();d++){
  const key=`${y}-${pad(m+1)}-${pad(d)}`,el=document.createElement('button');el.type='button';el.className='day';el.textContent=d;
  if(key===selected)el.classList.add('selected');if(key===today)el.classList.add('today');
  const totalTypes=['workout','reading','habit'].reduce((sum,t)=>sum+statsFor(key,t).done,0);
  if(totalTypes)el.classList.add('has-data');
  el.addEventListener('click',()=>{selected=key;renderAll();});cal.append(el);
 }
 const days=last.getDate();let sumPct=0,activeDays=0,totalDone=0,running=0,maxRunning=0;const cumulative=[];
 for(let d=1;d<=days;d++){const key=`${y}-${pad(m+1)}-${pad(d)}`,s=statsFor(key,active);sumPct+=s.pct;if(s.total)activeDays++;totalDone+=s.done;running+=s.done;cumulative.push({day:d,key,count:running});maxRunning=Math.max(maxRunning,running);}
 $('#monthPercent').innerHTML=`${activeDays?Math.round(sumPct/activeDays):0}% <small>평균 달성률</small>`;
 $('#monthCount').textContent=`${activeDays}일 기록`;$('#monthDoneText').textContent=`월 누적 완료 ${totalDone}건`;
 const bars=$('#bars');bars.innerHTML='';
 const step=Math.max(1,Math.ceil(days/15));
 for(let d=1;d<=days;d+=step){const point=cumulative[d-1],col=document.createElement('div');col.className='bar-col';const bar=document.createElement('div');bar.className='bar'+(point.key===selected?' current':'');bar.style.height=(maxRunning?Math.max(3,point.count/maxRunning*100):3)+'%';bar.title=`${d}일 기준 누적 완료 ${point.count}건`;const label=document.createElement('span');label.className='bar-label';label.textContent=d;col.append(bar,label);bars.append(col);}
}
function renderAll(){renderItems();renderCalendar();}
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{active=btn.dataset.type;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));renderAll();}));
$('#selectedDate').addEventListener('change',e=>{if(e.target.value){selected=e.target.value;shownMonth=parseKey(selected);renderAll();}});
$('#addForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),name=String(f.get('name')).trim(),unit=String(f.get('unit')).trim();if(!name)return;data.items[active].push({id:'i'+Date.now()+Math.random().toString(16).slice(2),name,unit});e.currentTarget.reset();persist();renderAll();});
$('#prevMonth').addEventListener('click',()=>{shownMonth=new Date(shownMonth.getFullYear(),shownMonth.getMonth()-1,1);renderCalendar();});
$('#nextMonth').addEventListener('click',()=>{shownMonth=new Date(shownMonth.getFullYear(),shownMonth.getMonth()+1,1);renderCalendar();});
$('#todayLabel').textContent=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(new Date());
if(!hasExistingData){
 for(const [type,cfg] of Object.entries(TYPES))data.items[type]=cfg.defaults.map(([name,unit],i)=>({id:`${type}-${i+1}`,name,unit}));
 persist();
}
renderAll();
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installBtn').hidden=false;});
$('#installBtn').addEventListener('click',async()=>{if(!installPrompt){alert('브라우저 메뉴에서 "홈 화면에 추가" 또는 "앱 설치"를 선택해 주세요.');return;}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#installBtn').hidden=true;});
window.addEventListener('appinstalled',()=>{$('#installBtn').hidden=true;});
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
</body></html>
