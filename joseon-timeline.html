<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조선시대 인터랙티브 연표</title>
<style>
  :root{
    --bg:#f6f4ee; --card:#ffffff; --ink:#2b2a28; --sub:#6d6a63; --line:#d9d4c7;
    --early:#3a7d6b; --mid:#c4761f; --late:#3b6fb6; --end:#a63d54;
    --accent:#3a7d6b; --radius:16px;
    --shadow:0 6px 24px rgba(40,35,20,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scrollbar-gutter:stable}
  html,body{min-height:100%}
  body{
    font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;
    display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
    overflow-x:hidden;
  }
  header{padding:clamp(16px,3vw,32px) 20px 8px;text-align:center}
  header h1{font-size:clamp(1.4rem,4vw,2.2rem);letter-spacing:-.02em}
  header p{color:var(--sub);font-size:clamp(.85rem,2.2vw,1rem);margin-top:4px}

  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;padding:8px 16px 0;font-size:.8rem;color:var(--sub)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

  /* 미니맵 */
  .mini{max-width:760px;width:calc(100% - 40px);margin:14px auto 0}
  .mini-bar{position:relative;height:6px;background:var(--line);border-radius:3px}
  .mini-dot{position:absolute;top:50%;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);opacity:.55;transition:all .35s}
  .mini-dot.on{width:16px;height:16px;opacity:1;box-shadow:0 0 0 4px rgba(0,0,0,.08)}
  .mini-labels{display:flex;justify-content:space-between;font-size:.72rem;color:var(--sub);margin-top:6px}

  main{flex:1;display:flex;flex-direction:column;width:100%;max-width:760px;margin:0 auto}
  .hint{text-align:center;color:var(--sub);font-size:.88rem;padding:10px 16px 0;min-height:2em}

  /* 타임라인 (세로) */
  .scroller{position:relative;padding:14px 16px 12px}
  .track{--yc:64px;position:relative;display:flex;flex-direction:column}
  .track::before{
    content:"";position:absolute;top:30px;bottom:30px;left:calc(var(--yc) + 14px + 9px);width:4px;
    background:linear-gradient(180deg,var(--early),var(--mid),var(--late),var(--end));
    border-radius:2px;opacity:.35;
  }
  .node{
    position:relative;display:grid;grid-template-columns:var(--yc) 22px 1fr;column-gap:14px;align-items:center;
    width:100%;background:none;border:0;font:inherit;color:inherit;cursor:pointer;text-align:left;
    padding:6px 0;outline:none;
  }
  .node .year{
    font-weight:700;font-size:1.05rem;text-align:right;white-space:nowrap;
    color:var(--sub);transition:all .3s;
  }
  .node .dot{
    width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--c);
    transition:transform .35s cubic-bezier(.3,1.5,.5,1),box-shadow .3s,background .3s;z-index:1;
  }
  .node .card{
    display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);
    padding:12px 14px;box-shadow:0 2px 8px rgba(40,35,20,.08);
    border-left:5px solid var(--c);transform-origin:left center;
    transition:transform .35s cubic-bezier(.3,1.4,.5,1),box-shadow .3s,background .3s;
  }
  .node .emoji{font-size:1.7rem;line-height:1.2;flex:0 0 auto}
  .node .name{font-weight:700;font-size:1.02rem;word-break:keep-all;line-height:1.35}
  .node:hover .card{transform:translateX(4px);box-shadow:0 6px 16px rgba(40,35,20,.14)}
  .node:focus-visible .card{outline:3px solid var(--c);outline-offset:3px}

  .node.active .year{color:var(--c);font-size:1.25rem}
  .node.active .dot{background:var(--c);transform:scale(1.55);box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 22%,transparent);animation:pulse 1.8s ease-in-out infinite}
  .node.active .card{transform:translateX(6px) scale(1.03);box-shadow:var(--shadow);background:color-mix(in srgb,var(--c) 8%,#fff)}
  @keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--c) 8%,transparent)}}

  .gap{
    height:34px;display:flex;align-items:center;
    padding-left:calc(var(--yc) + 14px + 22px + 14px + 6px);
  }
  .gap span{font-size:.74rem;color:var(--sub);white-space:nowrap}

  /* 컨트롤 */
  .controls{position:sticky;bottom:0;z-index:20;display:flex;justify-content:center;align-items:center;gap:12px;padding:22px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(246,244,238,0),var(--bg) 45%)}
  .btn{
    font:inherit;font-weight:600;font-size:.95rem;border:0;background:var(--card);color:var(--ink);
    padding:10px 18px;border-radius:999px;box-shadow:0 2px 8px rgba(40,35,20,.1);cursor:pointer;
    transition:transform .15s,box-shadow .2s;
  }
  .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(40,35,20,.16)}
  .btn:disabled{opacity:.4;cursor:default}
  .counter{font-size:.9rem;color:var(--sub);min-width:54px;text-align:center}

  /* 팝업 */
  .overlay{
    position:fixed;inset:0;background:rgba(30,26,18,.5);display:flex;align-items:center;justify-content:center;
    padding:16px;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:50;
  }
  .overlay.open{opacity:1;visibility:visible}
  .modal{
    background:var(--card);width:min(560px,100%);max-height:88dvh;overflow-y:auto;
    border-radius:22px;box-shadow:var(--shadow);border-top:8px solid var(--c);
    transform:translateY(24px) scale(.96);transition:transform .3s cubic-bezier(.3,1.3,.5,1);
    padding:24px 22px 18px;position:relative;
  }
  .overlay.open .modal{transform:none}
  .m-close{
    position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;
    background:#f0ede5;font-size:1.2rem;cursor:pointer;color:var(--sub)
  }
  .m-close:hover{background:#e6e2d7}
  .m-badge{
    display:inline-block;background:var(--c);color:#fff;font-size:.78rem;font-weight:700;
    padding:3px 12px;border-radius:999px;
  }
  .m-year{font-size:1rem;color:var(--sub);margin-top:10px;font-weight:600}
  .m-title{font-size:clamp(1.5rem,5vw,1.9rem);letter-spacing:-.02em;line-height:1.3;word-break:keep-all}
  .m-title .e{margin-right:6px}
  .m-sum{
    margin-top:12px;font-weight:600;font-size:1.05rem;background:color-mix(in srgb,var(--c) 10%,#fff);
    padding:12px 14px;border-radius:12px;word-break:keep-all
  }
  .m-body p{margin-top:12px;font-size:1rem;word-break:keep-all}
  .m-kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .m-kw span{font-size:.82rem;border:1.5px solid var(--c);color:var(--c);padding:2px 10px;border-radius:999px;font-weight:600}
  .m-point{
    margin-top:14px;padding:12px 14px;border-left:4px solid var(--c);background:#faf8f2;border-radius:0 12px 12px 0;
    font-size:.95rem;word-break:keep-all
  }
  .m-point b{color:var(--c)}
  .m-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  .m-nav .btn{flex:1;box-shadow:none;background:#f0ede5;padding:10px 8px;font-size:.9rem}

  @media (max-width:600px){
    .overlay{align-items:flex-end;padding:0}
    .modal{border-radius:22px 22px 0 0;max-height:85dvh;transform:translateY(100%)}
    .track{--yc:50px}
    .node .year{font-size:.95rem}
    .node.active .year{font-size:1.1rem}
    .node .card{padding:10px 12px}
    .node .name{font-size:.96rem}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<header>
  <h1>📜 조선시대 역사 연표</h1>
  <p>사건을 눌러서 옛날 이야기를 읽어 보세요! 아래로 내리면 시간이 흘러요.</p>
</header>

<div class="legend" id="legend"></div>

<div class="mini" aria-hidden="true">
  <div class="mini-bar" id="miniBar"></div>
  <div class="mini-labels"><span>1392년</span><span>1897년</span></div>
</div>

<main>
  <div class="hint" id="hint">👇 궁금한 사건을 눌러 보세요</div>
  <div class="scroller" id="scroller">
    <div class="track" id="track" role="list"></div>
  </div>
  <div class="controls">
    <button class="btn" id="prevBtn" type="button">◀ 이전</button>
    <span class="counter" id="counter">– / 10</span>
    <button class="btn" id="nextBtn" type="button">다음 ▶</button>
  </div>
</main>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" tabindex="-1">
    <button class="m-close" id="mClose" type="button" aria-label="닫기">✕</button>
    <span class="m-badge" id="mBadge"></span>
    <div class="m-year" id="mYear"></div>
    <h2 class="m-title" id="mTitle"></h2>
    <div class="m-sum" id="mSum"></div>
    <div class="m-body" id="mBody"></div>
    <div class="m-kw" id="mKw"></div>
    <div class="m-point" id="mPoint"></div>
    <div class="m-nav">
      <button class="btn" id="mPrev" type="button">◀ 이전 사건</button>
      <button class="btn" id="mNext" type="button">다음 사건 ▶</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var ERAS = {
    early:{name:"조선 전기",color:"#3a7d6b"},
    mid:{name:"조선 중기",color:"#c4761f"},
    late:{name:"조선 후기",color:"#3b6fb6"},
    end:{name:"조선 말기",color:"#a63d54"}
  };

  var EVENTS = [
    {year:1392,title:"조선 건국",era:"early",emoji:"👑",
     sum:"이성계 장군이 새 나라 '조선'을 세웠어요.",
     body:["그전에는 '고려'라는 나라가 있었어요. 그런데 나라가 점점 어지러워졌고, 백성들은 살기 힘들었어요.",
           "이성계 장군은 여러 신하들과 힘을 모아 새 나라를 세우고 이름을 '조선'이라고 지었어요. 그리고 1394년에 수도를 지금의 서울인 '한양'으로 옮겼답니다.",
           "이때부터 조선은 500년 넘게 이어졌어요!"],
     kw:["이성계","한양(서울)","새 나라"],
     point:"조선은 1392년에 시작해서 500년 넘게 이어진 나라예요."},

    {year:1418,title:"세종대왕 즉위",era:"early",emoji:"🤴",
     sum:"조선의 네 번째 임금, 세종대왕이 왕이 되었어요.",
     body:["세종대왕은 아버지 태종에게 왕의 자리를 물려받았어요. 이때 나이가 스물두 살이었어요.",
           "세종대왕은 백성을 무척 사랑하는 임금이었어요. 똑똑한 학자들을 모아 '집현전'에서 함께 공부하고 일했어요.",
           "비 온 양을 재는 '측우기'를 만드는 등 과학도 크게 발전시켰어요."],
     kw:["세종대왕","집현전","측우기","백성 사랑"],
     point:"세종대왕 시대에 문화와 과학이 크게 발전했어요."},

    {year:1443,title:"한글 창제",era:"early",emoji:"✍️",
     sum:"세종대왕이 우리 글자 '한글'을 만들었어요.",
     body:["옛날에는 우리말을 적을 글자가 없어서 어려운 한자를 써야 했어요. 그래서 글을 읽고 쓸 수 있는 사람이 많지 않았어요.",
           "세종대왕은 백성들이 쉽게 배우고 편하게 쓸 수 있는 글자를 만들고 싶었어요. 그래서 1443년에 새 글자를 만들었고, 1446년에 '훈민정음'이라는 이름으로 온 나라에 알렸어요.",
           "한글은 지금도 우리가 매일 쓰고 있는 글자예요!"],
     kw:["한글","훈민정음","세종대왕","백성을 위한 글자"],
     point:"한글은 '백성을 위해' 만든 글자라서 배우기 쉬워요."},

    {year:1592,title:"임진왜란",era:"mid",emoji:"⚔️",
     sum:"일본이 조선을 쳐들어와 전쟁이 일어났어요.",
     body:["1592년, 일본이 많은 군사를 이끌고 조선에 쳐들어왔어요. 이 전쟁이 '임진왜란'이에요.",
           "바다에서는 이순신 장군이 '거북선'과 뛰어난 작전으로 일본 배를 물리쳤어요. 땅에서는 평범한 백성들이 스스로 군사가 되어 싸웠는데, 이분들을 '의병'이라고 해요.",
           "전쟁은 1598년에 끝났어요. 힘들었지만 조선 사람들은 끝까지 나라를 지켜 냈답니다."],
     kw:["이순신","거북선","의병","한산도 대첩"],
     point:"장군도 백성도 힘을 합쳐 나라를 지켰어요."},

    {year:1636,title:"병자호란",era:"mid",emoji:"🏯",
     sum:"청나라가 쳐들어와 두 번째 큰 전쟁이 일어났어요.",
     body:["청나라는 조선에게 '우리를 따르라'고 요구했어요. 조선이 이를 거절하자, 1636년 청나라 군사가 쳐들어왔어요. 이 전쟁이 '병자호란'이에요.",
           "인조 임금은 '남한산성'이라는 산 위의 성으로 피했어요. 추운 겨울 동안 버텼지만 먹을 것이 떨어져서 결국 항복하고 말았어요.",
           "전쟁이 끝난 뒤 많은 백성이 고생을 했어요."],
     kw:["청나라","인조","남한산성"],
     point:"임진왜란 뒤 얼마 지나지 않아 또 큰 전쟁을 겪었어요."},

    {year:1724,title:"영조의 탕평책",era:"late",emoji:"⚖️",
     sum:"영조 임금이 싸움을 줄이려고 인재를 골고루 뽑았어요.",
     body:["그때 신하들은 서로 편을 갈라 자주 다퉜어요. 이런 모임을 '붕당'이라고 불러요.",
           "영조 임금은 이 다툼을 줄이기 위해 어느 편이든 상관없이 능력 있는 사람을 골고루 뽑아 쓰려고 했어요. 이 정책을 '탕평책'이라고 해요.",
           "'탕평'은 '치우치지 않고 공평하다'는 뜻이에요. 영조는 백성의 세금 부담을 줄이는 일에도 힘썼어요."],
     kw:["영조","탕평책","붕당","공평함"],
     point:"탕평책은 '편 가르기'를 멈추고 함께 일하자는 정책이에요."},

    {year:1794,title:"수원 화성 축조",era:"late",emoji:"🧱",
     sum:"정조 임금이 수원에 튼튼하고 멋진 성을 짓기 시작했어요.",
     body:["정조 임금은 새로운 도시를 만들고 싶어서 수원에 '화성'이라는 성을 짓기 시작했어요. 1794년에 시작해서 1796년에 완성했어요.",
           "학자 정약용은 무거운 돌을 쉽게 들어 올리는 '거중기'를 만들어 공사를 도왔어요.",

    {year:1866,title:"병인양요",era:"end",emoji:"🚢",
     sum:"프랑스 군함이 강화도에 쳐들어왔어요.",
     body:["그때 조선은 다른 나라와 교류하는 문을 굳게 닫고 있었어요. 그러다 프랑스 신부들이 처벌받는 일이 일어났어요.",
           "이를 구실로 1866년 프랑스 군함이 강화도에 들어와 싸움이 벌어졌어요. 이 사건이 '병인양요'예요.",
           "조선군은 힘껏 맞서 싸워 프랑스군을 물리쳤어요. 하지만 프랑스군이 물러나면서 귀한 책들을 가져가 버렸어요."],
     kw:["프랑스","강화도","흥선대원군"],
     point:"서양 나라들이 조선에 문을 열라고 요구하기 시작했어요."},

    {year:1894,title:"동학농민운동",era:"end",emoji:"🌾",
     sum:"농민들이 더 나은 세상을 만들려고 일어섰어요.",
     body:["그때 일부 관리들은 농민들에게서 세금을 지나치게 많이 걷었어요. 농민들은 먹고살기가 너무 힘들었어요.",
           "'동학'을 믿는 사람들과 농민들은 전봉준 장군을 중심으로 힘을 모아 들고 일어났어요. 이것이 '동학농민운동'이에요.",
           "농민들은 '모든 사람은 소중하다'는 마음으로 나라를 바꾸려고 했어요. 비록 뜻을 이루진 못했지만 우리 역사에 큰 영향을 남겼어요."],
     kw:["전봉준","동학","농민","평등"],
     point:"평범한 백성들이 직접 나서서 세상을 바꾸려 했어요."},

    {year:1897,title:"대한제국 선포",era:"end",emoji:"🇰🇷",
     sum:"고종이 황제가 되어 나라 이름을 '대한제국'으로 바꿨어요.",
     body:["그 무렵 여러 나라가 조선을 넘보고 있었어요. 고종 임금은 나라의 힘을 키우고 다른 나라와 대등하게 지내고 싶었어요.",
           "그래서 1897년에 '황제'의 자리에 올라 나라 이름을 '대한제국'이라고 정했어요. 연호는 '광무'였어요.",
           "대한제국은 전기와 전차를 들여오고 학교를 세우는 등 나라를 새롭게 바꾸려고 노력했어요."],
     kw:["고종","대한제국","광무개혁"],
     point:"우리나라 이름 '대한'은 이때부터 쓰였어요."}
  ];

  var scroller = document.getElementById("scroller");
  var track = document.getElementById("track");
  var overlay = document.getElementById("overlay");
  var modal = document.getElementById("modal");
  var hint = document.getElementById("hint");
  var counter = document.getElementById("counter");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var miniBar = document.getElementById("miniBar");

  var nodes = [], minis = [];
  var current = -1;
  var lastFocus = null;
  var initial = true;

  /* 범례 */
  var legend = document.getElementById("legend");
  Object.keys(ERAS).forEach(function(k){
    var s = document.createElement("span");
    s.innerHTML = '<i style="background:'+ERAS[k].color+'"></i>'+ERAS[k].name;
    legend.appendChild(s);
  });

  /* 타임라인 노드 생성 */
  EVENTS.forEach(function(ev, i){
    if(i > 0){
      var g = document.createElement("div");
      g.className = "gap";
      g.setAttribute("aria-hidden","true");
      g.innerHTML = "<span>↓ "+(ev.year - EVENTS[i-1].year)+"년 후</span>";
      track.appendChild(g);
    }
    var b = document.createElement("button");
    b.type = "button";
    b.className = "node";
    b.setAttribute("role","listitem");
    b.style.setProperty("--c", ERAS[ev.era].color);
    b.setAttribute("aria-label", ev.year+"년 "+ev.title);
    b.innerHTML =
      '<div class="year">'+ev.year+'</div>'+
      '<div class="dot"></div>'+
      '<div class="card"><div class="emoji">'+ev.emoji+'</div><div class="name">'+ev.title+'</div></div>';
    b.addEventListener("click", function(){
      if(dragMoved) return;
      select(i, true);
    });
    track.appendChild(b);
    nodes.push(b);

    /* 미니맵 점 */
    var d = document.createElement("span");
    d.className = "mini-dot";
    d.style.left = ((ev.year-1392)/(1897-1392)*100)+"%";
    d.style.background = ERAS[ev.era].color;
    miniBar.appendChild(d);
    minis.push(d);
  });

  /* 부드러운 세로 이동 */
  function centerOn(i, instant){
    var r = nodes[i].getBoundingClientRect();
    var barH = document.querySelector(".controls").offsetHeight;
    var target = window.pageYOffset + r.top + r.height/2 - (window.innerHeight - barH)/2;
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({top:Math.max(0,target), behavior:(instant||reduce)?"auto":"smooth"});
  }

  /* 선택 */
  function select(i, openPopup){
    if(i < 0 || i >= EVENTS.length) return;
    current = i;
    nodes.forEach(function(n,k){ n.classList.toggle("active", k===i); });
    minis.forEach(function(m,k){ m.classList.toggle("on", k===i); });
    counter.textContent = (i+1)+" / "+EVENTS.length;
    prevBtn.disabled = (i===0);
    nextBtn.disabled = (i===EVENTS.length-1);
    hint.textContent = EVENTS[i].year+"년 · "+EVENTS[i].title;
    if(!initial) centerOn(i);
    if(openPopup) openModal(i);
    else if(overlay.classList.contains("open")) fillModal(i);
  }

  /* 팝업 */
  function fillModal(i){
    var ev = EVENTS[i], era = ERAS[ev.era];
    modal.style.setProperty("--c", era.color);
    document.getElementById("mBadge").textContent = era.name;
    document.getElementById("mYear").textContent = ev.year+"년";
    document.getElementById("mTitle").innerHTML = '<span class="e">'+ev.emoji+'</span>'+ev.title;
    document.getElementById("mSum").textContent = ev.sum;
    document.getElementById("mBody").innerHTML = ev.body.map(function(t){return "<p>"+t+"</p>";}).join("");
    document.getElementById("mKw").innerHTML = ev.kw.map(function(k){return "<span>#"+k+"</span>";}).join("");
    document.getElementById("mPoint").innerHTML = "<b>💡 기억해요!</b> "+ev.point;
    document.getElementById("mPrev").disabled = (i===0);
    document.getElementById("mNext").disabled = (i===EVENTS.length-1);
    modal.scrollTop = 0;
  }
  function openModal(i){
    lastFocus = document.activeElement;
    fillModal(i);
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
    setTimeout(function(){ modal.focus(); }, 50);
  }
  function closeModal(){
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden","true");
    document.body.style.overflow = "";
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.getElementById("mClose").addEventListener("click", closeModal);
  overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
  document.getElementById("mPrev").addEventListener("click", function(){ select(current-1,false); });
  document.getElementById("mNext").addEventListener("click", function(){ select(current+1,false); });
  prevBtn.addEventListener("click", function(){ select(current<0?0:current-1,false); });
  nextBtn.addEventListener("click", function(){ select(current<0?0:current+1,false); });

  document.addEventListener("keydown", function(e){
    var open = overlay.classList.contains("open");
    if(e.key === "Escape" && open){ closeModal(); return; }
    if(e.key === "ArrowRight"){ e.preventDefault(); select(current<0?0:Math.min(current+1,EVENTS.length-1), false); }
    if(e.key === "ArrowLeft"){ e.preventDefault(); select(current<0?0:Math.max(current-1,0), false); }
    if(e.key === "Tab" && open){
      var f = modal.querySelectorAll("button:not(:disabled)");
      if(!f.length) return;
      var first = f[0], last = f[f.length-1];
      if(e.shiftKey && (document.activeElement===first || document.activeElement===modal)){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
  });

  var dragMoved = false;

  /* 시작: 첫 사건을 강조(팝업은 열지 않고, 화면도 움직이지 않음) */
  select(0,false);
  initial = false;
})();
</script>
</body>
</html>
